[package]
name = "datakit"
version = "0.1.0"
edition = "2021"
description = "Outils data natifs du portfolio : pseudonymisation déterministe et profilage qualité des CSV bruts"

[dependencies]
fancy-regex = "0.14"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
